<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>THE DESCENT — wireframe journey</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;
    font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;color:#fff}
  #c{display:block;width:100vw;height:100vh}
  .hud{position:fixed;pointer-events:none;letter-spacing:.32em;font-size:11px;
    text-transform:uppercase;opacity:.6;mix-blend-mode:screen}
  #title{top:26px;left:30px}
  #phase{top:26px;right:30px;opacity:.75;transition:opacity .5s}
  #hint{left:50%;bottom:26px;transform:translateX(-50%);opacity:0;transition:opacity 1s;font-size:10px}
  #fail{position:fixed;inset:0;display:none;place-items:center;text-align:center;
    letter-spacing:.18em;font-size:13px;line-height:2;opacity:.7}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud" id="title">THE&nbsp;DESCENT</div>
<div class="hud" id="phase">APPROACH</div>
<div class="hud" id="hint">CLICK&nbsp;TO&nbsp;REPLAY</div>
<div id="fail">THREE.JS COULD NOT LOAD<br/>THIS FILE NEEDS AN INTERNET CONNECTION<br/>FOR THE THREE.JS CDN ON FIRST OPEN</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
if(!window.THREE){document.getElementById('fail').style.display='grid';}
else{(function(){
"use strict";
var THREE=window.THREE;
var W=innerWidth,H=innerHeight;
var renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(W,H);
var scene=new THREE.Scene();
var camera=new THREE.PerspectiveCamera(34,W/H,0.01,100);

/* ---- root that we tilt slightly for a 2.5D parallax feel ---- */
var rig=new THREE.Group(); scene.add(rig);
var world=new THREE.Group(); rig.add(world);          // the rotating planet
var R=1;

function lineMat(o){return new THREE.LineBasicMaterial({color:0xffffff,transparent:true,
  opacity:o,blending:THREE.AdditiveBlending,depthWrite:false});}

/* ---- graticule sphere : latitude + longitude lines ---- */
var gratMat=lineMat(0.16);
var gpos=[];
function ll2v(lat,lon,r){var p=lat*Math.PI/180,t=lon*Math.PI/180;
  return new THREE.Vector3(r*Math.cos(p)*Math.cos(t),r*Math.sin(p),r*Math.cos(p)*Math.sin(t));}
for(var lat=-75;lat<=75;lat+=15){var pr=null;
  for(var lo=0;lo<=360;lo+=6){var v=ll2v(lat,lo,R);
    if(pr){gpos.push(pr.x,pr.y,pr.z,v.x,v.y,v.z);} pr=v;}}
for(var lon=0;lon<360;lon+=15){var p2=null;
  for(var la=-90;la<=90;la+=4){var v2=ll2v(la,lon,R);
    if(p2){gpos.push(p2.x,p2.y,p2.z,v2.x,v2.y,v2.z);} p2=v2;}}
var gg=new THREE.BufferGeometry();
gg.setAttribute('position',new THREE.Float32BufferAttribute(gpos,3));
world.add(new THREE.LineSegments(gg,gratMat));

/* ---- procedural "continents" as a fine point field (google-earth-ish) ---- */
var dirs=[],i;
for(i=0;i<7;i++){var a=Math.random()*6.283,b=Math.acos(2*Math.random()-1);
  dirs.push({d:new THREE.Vector3(Math.sin(b)*Math.cos(a),Math.cos(b),Math.sin(b)*Math.sin(a)),
             f:1.4+i*1.05,p:Math.random()*6.283,a:1/(1+i*0.55)});}
function land(v){var s=0;for(var k=0;k<dirs.length;k++){var D=dirs[k];
  s+=D.a*Math.sin(v.dot(D.d)*D.f+D.p);} return s;}
var lp=[],N=20000;
for(i=0;i<N;i++){var y=1-2*(i+0.5)/N,rr=Math.sqrt(1-y*y),th=i*2.399963;
  var v=new THREE.Vector3(Math.cos(th)*rr,y,Math.sin(th)*rr);
  if(land(v)>0.35){lp.push(v.x*1.004,v.y*1.004,v.z*1.004);}}
var lg=new THREE.BufferGeometry();
lg.setAttribute('position',new THREE.Float32BufferAttribute(lp,3));
var landMat=new THREE.PointsMaterial({color:0xffffff,size:0.009,transparent:true,
  opacity:0.0,blending:THREE.AdditiveBlending,depthWrite:false});
world.add(new THREE.Points(lg,landMat));

/* ---- landing target : reticle of expanding rings at the site ---- */
var SITE=ll2v(22,150,1).normalize();                    // landing point (unit, world-local)
function ring(r,seg){var a=[];for(var s=0;s<=seg;s++){var t=s/seg*6.2832;
  a.push(Math.cos(t)*r,Math.sin(t)*r,0);} var g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(a,3));return g;}
var reticle=new THREE.Group();
var rMats=[lineMat(0),lineMat(0),lineMat(0)];
for(i=0;i<3;i++){var L=new THREE.Line(ring(0.05+i*0.05,64),rMats[i]);reticle.add(L);}
var cross=new THREE.LineSegments(new THREE.BufferGeometry().setAttribute('position',
  new THREE.Float32BufferAttribute([-0.03,0,0,0.03,0,0,0,-0.03,0,0,0.03,0],3)),lineMat(0));
reticle.add(cross);
var q=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,0,1),SITE);
reticle.quaternion.copy(q); reticle.position.copy(SITE.clone().multiplyScalar(1.001));
world.add(reticle);

/* ---- tangent basis at the site (for spiral descent + camera offset) ---- */
var up0=Math.abs(SITE.y)>0.9?new THREE.Vector3(1,0,0):new THREE.Vector3(0,1,0);
var E1=new THREE.Vector3().crossVectors(up0,SITE).normalize();
var E2=new THREE.Vector3().crossVectors(SITE,E1).normalize();

/* ---- the plane : a few white lines ---- */
function seg(arr,o){var g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(arr,3));
  return new THREE.LineSegments(g,lineMat(o));}
var plane=new THREE.Group();
plane.add(seg([-0.13,0,0, 0.16,0,0,  -0.02,0,-0.11, -0.02,0,0.11,
               0.12,0,-0.05, 0.12,0,0.05, -0.13,0,-0.04,-0.13,0,0.04],0.85));
scene.add(plane);

/* ---- the pilot under a paraglider canopy ---- */
var pilot=new THREE.Group();
var canopy=[]; for(i=-5;i<=5;i++){var x=i/5; canopy.push(x*0.16,-x*x*0.05,0);}
var canopyLine=[]; for(i=0;i<canopy.length-3;i+=3){
  canopyLine.push(canopy[i],canopy[i+1],canopy[i+2],canopy[i+3],canopy[i+4],canopy[i+5]);}
canopyLine.push(-0.16,-0.05,0, -0.13,-0.085,0,  0.16,-0.05,0, 0.13,-0.085,0); // tips droop
var pcan=seg(canopyLine,0.9); pilot.add(pcan);
pilot.add(seg([-0.13,-0.085,0, -0.012,-0.30,0,  0.13,-0.085,0, 0.012,-0.30,0,
               0,-0.30,0, 0,-0.36,0],0.85));         // risers + body
scene.add(pilot);

/* ---- ground ripple on touchdown ---- */
var rip=new THREE.Line(ring(0.04,48),lineMat(0));
rip.quaternion.copy(q); rip.position.copy(SITE.clone().multiplyScalar(1.002));
world.add(rip);

/* ---- faint star dust ---- */
var sp=[]; for(i=0;i<260;i++){var u=Math.random()*6.283,w=Math.acos(2*Math.random()-1),rad=14+Math.random()*10;
  sp.push(Math.sin(w)*Math.cos(u)*rad,Math.cos(w)*rad*0.7,Math.sin(w)*Math.sin(u)*rad);}
var sgeo=new THREE.BufferGeometry();
sgeo.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));
scene.add(new THREE.Points(sgeo,new THREE.PointsMaterial({color:0xffffff,size:0.03,
  transparent:true,opacity:0.35,blending:THREE.AdditiveBlending,depthWrite:false})));

/* ---- timeline helpers ---- */
function sstep(a,b,x){x=Math.max(0,Math.min(1,(x-a)/(b-a)));return x*x*(3-2*x);}
function lerp(a,b,t){return a+(b-a)*t;}
var phaseEl=document.getElementById('phase'),hintEl=document.getElementById('hint');
var clock=new THREE.Clock(),t0=0,mx=0,my=0,tmx=0,tmy=0;
addEventListener('pointermove',function(e){tmx=(e.clientX/innerWidth-0.5);tmy=(e.clientY/innerHeight-0.5);});
function replay(){t0=clock.getElapsedTime();hintEl.style.opacity=0;}
addEventListener('click',replay); addEventListener('keydown',replay);

var v3=new THREE.Vector3(),siteW=new THREE.Vector3(),camDir=new THREE.Vector3();

function frame(){
  requestAnimationFrame(frame);
  var T=clock.getElapsedTime()-t0;

  /* planet always drifts slowly; extra yaw turns the site to face us */
  world.rotation.y = -0.04*clock.getElapsedTime() + lerp(0.9,0.0,sstep(4.5,12,T));
  world.rotation.x = lerp(0.15,0.32,sstep(0,12,T));

  /* detail "zooms in": land + grid brighten as we approach */
  var zoom=sstep(4.5,12.5,T);
  landMat.opacity = 0.55*sstep(4,12,T);
  landMat.size    = lerp(0.009,0.016,zoom);
  gratMat.opacity = lerp(0.16,0.42,zoom);

  /* world position of the landing site (it rotates with the planet) */
  siteW.copy(SITE).applyEuler(world.rotation);

  /* camera : far overview -> close on the site, slight off-normal 2.5D angle */
  var dist=lerp(6.4,1.62,sstep(4.5,13,T));
  camDir.copy(siteW).multiplyScalar(Math.cos(0.5))
        .add(E1.clone().applyEuler(world.rotation).multiplyScalar(Math.sin(0.5)));
  camera.position.copy(camDir.normalize().multiplyScalar(dist));
  v3.copy(siteW).multiplyScalar(lerp(0.0,1.0,sstep(6,12,T)));   // look from centre -> site
  camera.up.set(0,1,0); camera.lookAt(v3);

  /* 2.5D parallax from the pointer */
  mx+=(tmx-mx)*0.05; my+=(tmy-my)*0.05;
  rig.rotation.y=mx*0.18; rig.rotation.x=-my*0.12;

  /* PLANE : crosses high, exits */
  var pu=sstep(0,8,T);
  var apex=siteW.clone().normalize().multiplyScalar(2.55)
            .add(E2.clone().applyEuler(world.rotation).multiplyScalar(0.25));
  var across=E1.clone().applyEuler(world.rotation);
  plane.position.copy(apex).add(across.clone().multiplyScalar(lerp(-3.4,3.4,pu)))
       .add(siteW.clone().normalize().multiplyScalar(Math.sin(pu*3.14)*0.25));
  plane.lookAt(plane.position.clone().add(across));
  plane.visible=T<8.4 && T>0;
  var pf=1-sstep(7.4,8.4,T); plane.scale.setScalar(0.55*Math.max(0.001,pf));

  /* PILOT : detaches mid-cross, spirals down onto the site */
  var dz=sstep(4.2,12.6,T);                 // descent progression
  var du=sstep(0,8,4.2);                                  // where the plane is at detach
  var detach=apex.clone().add(across.clone().multiplyScalar(lerp(-3.4,3.4,du)));
  var rad=lerp(detach.length(),1.0,dz*dz*(3-2*dz));
  var ang=dz*7.2, swirl=lerp(0.42,0.0,dz);
  var lateral=E1.clone().applyEuler(world.rotation).multiplyScalar(Math.cos(ang)*swirl)
             .add(E2.clone().applyEuler(world.rotation).multiplyScalar(Math.sin(ang)*swirl));
  var start=detach.clone();
  var ppos=siteW.clone().normalize().multiplyScalar(rad).add(lateral);
  ppos.lerp(start, 1-sstep(4.2,5.4,T));      // ease out of the plane handoff
  pilot.position.copy(ppos);
  var outward=ppos.clone().normalize();
  pilot.up.copy(outward);
  pilot.lookAt(ppos.clone().add(across));
  var land=sstep(11.6,12.6,T);
  pcan.scale.set(1,lerp(1,0.05,land),1);     // canopy collapses on landing
  pilot.visible=T>4.0;
  pilot.scale.setScalar(lerp(0.85,0.5,sstep(5,12,T)));

  /* reticle pulse + touchdown ripple */
  for(i=0;i<3;i++){var pp=(T*0.6+i*0.33)%1;
    rMats[i].opacity=sstep(5.5,7,T)*(1-pp)*0.7*(1-land*0.6);}
  cross.material.opacity=sstep(5.5,7,T)*0.6*(1-land*0.6);
  var rk=sstep(11.8,14,T);
  rip.material.opacity=(1-rk)*0.8*sstep(11.8,12,T);
  rip.scale.setScalar(lerp(0.4,7,rk));

  /* HUD phase label + replay hint */
  var ph=T<3.6?'APPROACH':T<5?'DROP':T<11.6?'DESCENT':T<14?'TOUCHDOWN':'ARRIVED';
  if(phaseEl.textContent!==ph)phaseEl.textContent=ph;
  if(T>14.4)hintEl.style.opacity=0.55;

  renderer.render(scene,camera);
}
addEventListener('resize',function(){W=innerWidth;H=innerHeight;
  camera.aspect=W/H;camera.updateProjectionMatrix();renderer.setSize(W,H);});
frame();
})();}
</script>
</body>
</html>
