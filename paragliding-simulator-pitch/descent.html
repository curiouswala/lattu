<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>THE DESCENT</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:crosshair;
    font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace}
  canvas{display:block}
  .hud{position:fixed;color:#fff;pointer-events:none;letter-spacing:.34em;font-size:11px;
    text-transform:uppercase;opacity:.55;mix-blend-mode:screen}
  #title{top:26px;left:30px}
  #phase{top:26px;right:30px;opacity:.7}
  #hint{left:50%;bottom:26px;transform:translateX(-50%);opacity:0;transition:opacity 1s;font-size:10px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud" id="title">THE&nbsp;DESCENT</div>
<div class="hud" id="phase">APPROACH</div>
<div class="hud" id="hint">CLICK&nbsp;TO&nbsp;REPLAY</div>
<script>
(function(){
"use strict";
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var W,H,CX,CY,DPR=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;
  cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);
  CX=W/2;CY=H/2;}
addEventListener('resize',resize);resize();

/* ---------- math ---------- */
function rotY(p,a){var c=Math.cos(a),s=Math.sin(a);
  return[p[0]*c+p[2]*s,p[1],-p[0]*s+p[2]*c];}
function rotX(p,a){var c=Math.cos(a),s=Math.sin(a);
  return[p[0],p[1]*c-p[2]*s,p[1]*s+p[2]*c];}
function ll(lat,lon){var p=lat*Math.PI/180,t=lon*Math.PI/180;
  return[Math.cos(p)*Math.cos(t),Math.sin(p),Math.cos(p)*Math.sin(t)];}

/* ---------- graticule (lat / lon lines on a unit sphere) ---------- */
var SEG=[],lat,lon,a,b;
for(lat=-75;lat<=75;lat+=15){b=null;
  for(lon=0;lon<=360;lon+=6){a=ll(lat,lon);if(b)SEG.push([b,a]);b=a;}}
for(lon=0;lon<360;lon+=15){b=null;
  for(lat=-90;lat<=90;lat+=4){a=ll(lat,lon);if(b)SEG.push([b,a]);b=a;}}

/* ---------- procedural continents as a point field ---------- */
var DIR=[],k;
for(k=0;k<7;k++){var u=Math.random()*6.283,w=Math.acos(2*Math.random()-1);
  DIR.push({d:[Math.sin(w)*Math.cos(u),Math.cos(w),Math.sin(w)*Math.sin(u)],
            f:1.4+k*1.05,ph:Math.random()*6.283,am:1/(1+k*0.55)});}
function landv(v){var s=0;for(var j=0;j<DIR.length;j++){var D=DIR[j];
  s+=D.am*Math.sin((v[0]*D.d[0]+v[1]*D.d[1]+v[2]*D.d[2])*D.f+D.ph);}return s;}
var LAND=[],N=14000;
for(k=0;k<N;k++){var y=1-2*(k+0.5)/N,r=Math.sqrt(1-y*y),th=k*2.399963;
  var v=[Math.cos(th)*r,y,Math.sin(th)*r];if(landv(v)>0.33)LAND.push(v);}

/* ---------- stars ---------- */
var STAR=[];for(k=0;k<220;k++){
  STAR.push([(Math.random()-0.5)*4,(Math.random()-0.5)*2.6,-Math.random()*3-1.5,
             0.2+Math.random()*0.5]);}

/* ---------- timeline helpers ---------- */
function ss(a0,a1,x){x=(x-a0)/(a1-a0);x=x<0?0:x>1?1:x;return x*x*(3-2*x);}
function lp(a0,a1,t){return a0+(a1-a0)*t;}
var phaseEl=document.getElementById('phase'),hintEl=document.getElementById('hint');
var t0=performance.now(),lastPhase='',mx=0,my=0,tx=0,ty=0;
addEventListener('pointermove',function(e){tx=e.clientX/innerWidth-0.5;ty=e.clientY/innerHeight-0.5;});
function replay(){t0=performance.now();hintEl.style.opacity=0;}
addEventListener('click',replay);addEventListener('keydown',replay);

/* ---------- projection ---------- */
var camDist,focal,parX,parY;
function proj(p){var z=camDist-p[2];if(z<0.04)return null;
  var s=focal/z;return[CX+p[0]*s,CY-p[1]*s,z,s];}
function parallax(p){return rotX(rotY(p,parX),parY);}            // camera-frame objects
function planetT(p,yaw,tilt){return parallax(rotX(rotY(p,yaw),tilt));}

function dot(x,y,r,al){ctx.globalAlpha=al;ctx.beginPath();
  ctx.arc(x,y,r,0,6.2832);ctx.fill();}
function line(A,B,al){ctx.globalAlpha=al;ctx.beginPath();
  ctx.moveTo(A[0],A[1]);ctx.lineTo(B[0],B[1]);ctx.stroke();}

/* ---------- frame ---------- */
function frame(now){
  requestAnimationFrame(frame);
  var T=(now-t0)/1000;

  camDist = lp(5.4,1.62,ss(4.3,12.8,T));
  focal   = 0.92*Math.min(W,H);
  mx+=(tx-mx)*0.05;my+=(ty-my)*0.05;
  parX = mx*0.5;
  parY = my*0.32 + lp(-0.05,0.34,ss(5,12.5,T));         // tip "down" while descending
  var yaw  = -0.18*T - 0.5;                              // planet keeps turning
  var tilt = 0.34;

  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';

  /* stars */
  ctx.fillStyle='#cfe3f2';
  for(k=0;k<STAR.length;k++){var sp=parallax([STAR[k][0],STAR[k][1],STAR[k][2]]);
    var P=proj(sp);if(P)dot(P[0],P[1],0.7,STAR[k][3]*0.5);}

  /* graticule */
  ctx.strokeStyle='#dff1ff';ctx.lineWidth=1;
  var gA=lp(0.10,0.30,ss(4,12,T));
  for(k=0;k<SEG.length;k++){
    var qa=planetT(SEG[k][0],yaw,tilt),qb=planetT(SEG[k][1],yaw,tilt);
    if(qa[2]<-0.18&&qb[2]<-0.18)continue;               // cull far back
    var A=proj(qa),B=proj(qb);if(!A||!B)continue;
    var f=(qa[2]+qb[2])*0.5;
    line(A,B,gA*(0.35+0.65*Math.max(0,f+0.2)));
  }

  /* continents */
  ctx.fillStyle='#ffffff';
  var lA=0.62*ss(4,11.5,T),lr=lp(0.6,1.25,ss(4.3,12.8,T));
  if(lA>0.001)for(k=0;k<LAND.length;k++){var qp=planetT(LAND[k],yaw,tilt);
    if(qp[2]<-0.05)continue;var P2=proj(qp);
    if(P2)dot(P2[0],P2[1],lr,lA*(0.4+0.6*Math.min(1,qp[2]+0.4)));}

  /* landing reticle at the front of the globe (camera-frame) */
  var siteC=parallax([0,0,1]),SP=proj(siteC);
  if(SP){var rk=ss(11.7,13.6,T),touch=ss(11.4,12.2,T);
    ctx.strokeStyle='#ffffff';
    var rg=ss(5.3,6.8,T)*(1-touch*0.7);
    for(k=0;k<3;k++){var pulse=((T*0.55+k*0.34)%1);
      ctx.globalAlpha=rg*(1-pulse)*0.7;ctx.beginPath();
      ctx.ellipse(SP[0],SP[1],(10+pulse*46)*SP[3]*0.012,(10+pulse*46)*SP[3]*0.006,0,0,6.2832);
      ctx.stroke();}
    ctx.globalAlpha=rg*0.6;
    line([SP[0]-9,SP[1]],[SP[0]+9,SP[1]],rg*0.6);
    line([SP[0],SP[1]-5],[SP[0],SP[1]+5],rg*0.6);
    if(rk>0){ctx.globalAlpha=(1-rk)*0.8;ctx.beginPath();      // touchdown ripple
      ctx.ellipse(SP[0],SP[1],rk*150,rk*78,0,0,6.2832);ctx.stroke();}
  }

  /* the plane : a few lines, crossing high then gone */
  var pu=ss(0,8,T);
  if(T<8.3){
    var px=lp(-3.0,3.0,pu),py=1.45,pz=2.25+Math.sin(pu*3.1416)*0.25;
    var pf=(1-ss(7.3,8.3,T))*lp(1,0.6,ss(4,8,T));
    var sh=[[-0.13,0,0],[0.17,0,0],[-0.02,0,-0.12],[-0.02,0,0.12],
            [0.12,0,-0.05],[0.12,0,0.05],[-0.13,0,-0.045],[-0.13,0,0.045]];
    ctx.strokeStyle='#ffffff';var pts=[];
    for(k=0;k<sh.length;k++){var sp2=parallax([sh[k][0]*0.6+px,sh[k][1]*0.6+py,sh[k][2]*0.6+pz]);
      pts.push(proj(sp2));}
    if(pts[0]&&pts[1]){line(pts[0],pts[1],0.9*pf);line(pts[2],pts[3],0.9*pf);
      line(pts[4],pts[5],0.9*pf);line(pts[6],pts[7],0.9*pf);}
  }

  /* the pilot : detaches mid-cross, spirals down to the site */
  if(T>4.05){
    var du=ss(0,8,4.2),dx0=lp(-3.0,3.0,du),dz0=2.25+Math.sin(du*3.1416)*0.25;
    var dz=ss(4.2,12.4,T),e=dz*dz*(3-2*dz);
    var swirl=lp(0.55,0.0,dz),ang=dz*7.5;
    var cx2=lp(dx0,0,e)+Math.cos(ang)*swirl;
    var cy2=lp(1.45,0.02,e)+Math.sin(ang)*swirl*0.5;
    var cz2=lp(dz0,1.0,e);
    var land=ss(11.3,12.2,T),sc=lp(0.85,0.42,ss(5,12,T));
    /* canopy arc + risers + body, built in local then placed */
    ctx.strokeStyle='#ffffff';
    var prev=null,ci;
    for(ci=-5;ci<=5;ci++){var lx=ci/5;
      var lpv=parallax([cx2+lx*0.17*sc,cy2-lx*lx*0.05*sc+0.30*sc*(1-land),cz2]);
      var CP=proj(lpv);if(prev&&CP)line(prev,CP,0.85);prev=CP;}
    var bodyTop=parallax([cx2,cy2+0.30*sc*(1-land),cz2]);
    var bodyBot=parallax([cx2,cy2-0.06*sc,cz2]);
    var bt=proj(bodyTop),bb=proj(bodyBot);
    var lT=parallax([cx2-0.17*sc,cy2+0.30*sc*(1-land),cz2]);
    var rT=parallax([cx2+0.17*sc,cy2+0.30*sc*(1-land),cz2]);
    var ltP=proj(lT),rtP=proj(rT);
    if(bt&&bb){line(bt,bb,0.85);}
    if(ltP&&bb)line(ltP,bb,0.7*(1-land));
    if(rtP&&bb)line(rtP,bb,0.7*(1-land));
  }

  ctx.globalCompositeOperation='source-over';

  var ph=T<3.6?'APPROACH':T<5?'DROP':T<11.4?'DESCENT':T<13.6?'TOUCHDOWN':'ARRIVED';
  if(ph!==lastPhase){phaseEl.textContent=ph;lastPhase=ph;}
  if(T>13.8)hintEl.style.opacity=0.5;
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
